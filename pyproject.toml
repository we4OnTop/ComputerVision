[project]
name = ""
version = "0.0.1"
requires-python = "~=3.12"
dependencies = [
    "numpy==2.2.6",
    "matplotlib==3.10.7",
    "torch",
    "torchvision",
    "torchinfo==1.8.0",
    "torch-utils==0.1.2",
    "jupyter==1.1.1",
    "opencv-python==4.12.0.88",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "seaborn==0.13.2",
    "bokeh==3.8.1",
    "pandas==2.3.3",
    "albumentations==2.0.8",
    "datasets==4.4.1",
    "accelerate==1.12.0",
    "segment-anything==1.0",
    "diffusers==0.35.2",
    "ultralytics==8.3.240",
    "onnxscript==0.6.2",
    "moviepy==2.2.1",
    "jinja2==3.1.5",
    "pydantic==2.11.6",
    "openai==2.48.0",
    "tiktoken==0.13.0",
    "tavily==1.1.0",
    "chromadb==1.5.9",
    "pdfplumber==0.11.9",
    "pillow==11.3.0",
    "transformers==5.15.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
